[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.1.0"
description = "ML inference profiler and bottleneck visualizer for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tracelens = "tracelens.cli:main"

[tool.setuptools.packages.find]
include = ["tracelens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
